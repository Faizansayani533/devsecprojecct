apiVersion: apps/v1
kind: Deployment
metadata:
  name: three-tier-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: three-tier-frontend
  template:
    metadata:
      labels:
        app: three-tier-frontend
    spec:
      containers:
      - name: frontend
        image: 079662785620.dkr.ecr.eu-north-1.amazonaws.com/three-tier-frontend:41
        ports:
        - containerPort: 80

